    optimizer: adam
    learning_rate: 0.0005
    curvature: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    normalized_rate: 0.0001
    step_fraction: 0.5
    iterations: 16
  - name: adam_lr_001
    optimizer: adam
    learning_rate: 0.001
    curvature: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    normalized_rate: 0.0001
    step_fraction: 0.5
    iterations: 16
