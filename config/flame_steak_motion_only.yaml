# 本轮：共享首帧，再训练299个后续帧；每帧200步，只更新运动。
# 每帧从上一帧运动的0.6倍开始拟合；新增和删除GS都关闭。
# Storage loss设为0；仍记录稠密量化运动的参数字节估算。
output_dir: output
experiment_name: fs_motion_only_storage_300_steps200
mode: train
ckpt_path: /home/gamer-02/Documents/DeepLearning/ReCon-GS/output/flame_steak_fullres/20260926T225223_dc5baf/ckpt-0-15000.pth

trainer:
  selective_console_mode: compact
  cache_data_on_device: true
  testing_steps: [30, 150] # 最后200步也会自动评估。
  first_frame_testing_steps: []
  num_init_steps: 15000
  num_incr_steps: 200
  saving_ckpt_steps: []
  saving_ckpt_frames: [5] # 第5帧和最后第299帧保存完整checkpoint。

data:
  root: data/colmap4d/flame_steak
  resolution: -1
  white_background: false
  split_train_test: true
  shuffle: true
  eval_train: false
  first_frame_eval_train: true
  eval_test: true
  extra_dataset_kwargs:
    num_frames: 300 # 含共享首帧0，以及后续帧1～299。
  extra_dataloader_kwargs:
    num_workers: 8
    pin_memory: true

module:
  motion_mode: quantized_residual
  # 使用有效参数字节估算；当前训练不使用码流。
  selective_diagnostics_config: null # 可选区域覆盖图已关闭；该诊断配置文件不再使用。
  sh_degree: 1
  random_background: false
  lambda_dssim: 0.2
  lambda_deform: 0.0
  saving_gs_steps: []
  saving_gs_frames: [5] # 第5帧和最后一帧保存PLY。
  num_saving_images: 5
  full_eval: true
  lpips_required: false
  renderer:
    compute_cov3D_python: false
    convert_SHs_python: false
    debug_from: -1
    debug: false
  deformation:
    num_stage1_steps: 200 # 与motion_steps一致。

  quantized_residual:
    fine_region_gs: 24 # 最细区域约24个GS；共三层区域，加逐GS残差。
    motion_steps: 200
    shared_warmup_steps: 30 # 前30步只优化共享运动，后170步联合优化。
    motion_init_decay: 0.6 # 上一帧总运动的0.6倍作为初值；第一帧从0开始。
    enable_incremental: false # 同时关闭新增GS及对应的补偿删除。
    incremental_steps: 0
    region_translation_lr: 0.0005
    region_rotation_lr: 0.0005
    gs_translation_lr: 0.0001
    gs_rotation_lr: 0.0001
    adam_betas: [0.9, 0.999]
    adam_eps: 1.0e-08

    # 量化精度：位置用场景范围乘下列系数，旋转用弧度。
    motion_xyz_step_extent: 1.0e-05
    motion_rotation_step_rad: 0.001

    storage_only: true # 估算所有区域和逐GS运动的float32参数字节，不假设稀疏索引免费。
    storage_loss_weight: 0.0 # motion-only：只记录存储量，不用存储项更新参数。
    storage_warmup_steps: 30 # 权重为0时不影响训练；保留原调度步数。
    storage_ramp_steps: 50

    # 新增GS接口所需参数；关闭新增时不参与拟合。
    new_xyz_step_extent: 1.0e-05
    new_rotation_step: 0.001
    new_logscale_step: 0.001
    new_opacity_step: 0.01
    new_sh_step: 0.001
    opacity_keep_threshold: 0.01
    opacity_support_temperature: 0.05
    clone_sigma_scale: 2.0
    new_max_screen_size: 20.0

gui_ip: 127.0.0.1
gui_port: 6009
detect_anomaly: false
quiet: false
