# 单层运动聚类候选：40探针+100拟合+60学门+40精修+100补点。
# 保留共享首帧与基础GS；无运动父子层级、octree或attribute gate。
# 实际加载尺寸强制检查为2689x2016；300帧。当前由用户手动启动。
ckpt_path: /home/gamer-02/Documents/DeepLearning/ReCon-GS/output/flame_steak_fullres/20260926T225223_dc5baf/ckpt-0-15000.pth
data:
  eval_test: true
  eval_train: false
  extra_dataloader_kwargs:
    num_workers: 8
    pin_memory: true
  extra_dataset_kwargs:
    num_frames: 300
  first_frame_eval_train: false
  resolution: 1  # libgs保留原始尺寸
  expected_image_size: [2689, 2016]  # 检查实际加载后的张量，不依赖相机元数据
  root: data/colmap4d/flame_steak
  shuffle: true
  split_train_test: true
  training_camera_names: null
  training_view_seed: 0
  validation_camera_names: null
  white_background: false
detect_anomaly: false
experiment_name: fs_flat_cluster_p40_fullres_300
gui_ip: 127.0.0.1
gui_port: 6009
mode: train
module:
  deformation:
    densify_grad_threshold: 0.00015
    densify_interval: 40
    num_stage1_steps: 240
    opacity_threshold: 0.01
  full_eval: true
  gaussian_stage2:
    feature_lr: 0.0375
    opacity_lr: 0.75
    percent_dense: 0.01
    position_lr_delay_mult: 0.01
    position_lr_final: 2.4e-05
    position_lr_init: 0.0024
    position_lr_max_steps: 15000
    rotation_lr: 0.015
    scaling_lr: 0.075
  lambda_deform: 0.0
  lambda_dssim: 0.2
  lpips_required: false
  motion_mode: flat_cluster
  num_saving_images: 5
  quantized_diagnostics:
    actual_motion_enabled: true
    control_quality_camera_names:
    - cam01.png
    - cam17.png
    - cam18.png
    - cam19.png
    - cam20.png
    control_quality_enabled: true
    deletion_damage_enabled: false
    deletion_damage_every_n_frames: 1
    deletion_damage_view_name: cam00.png
    gradient_steps:
    - 1
    - 40
    - 41
    - 140
    - 141
    - 200
    - 201
    - 240
    prediction_quality_enabled: true
    rotation_radian_thresholds:
    - 0.0
    - 0.001
    - 0.01
    translation_extent_thresholds:
    - 0.0
    - 1.0e-05
    - 0.0001
    - 0.001
  random_background: false
  renderer:
    compute_cov3D_python: false
    convert_SHs_python: false
    debug: false
    debug_from: -1
  saving_gs_frames: &id001
  - 5
  - 24
  - 50
  - 100
  - 200
  - 299
  saving_gs_steps: []
  selective_diagnostics_config: null
  sh_degree: 1
  flat_cluster:
    adam_betas:
    - 0.9
    - 0.999
    adam_eps: 1.0e-08
    clone_sigma_scale: 2.0
    dense_fit_steps: 100
    densification_stats_steps: 30
    enable_incremental: true
    enable_learned_gates: true
    cluster_gs: 24  # 单层初始簇平均约24个GS；没有父子区域预算
    gate_compress_steps: 60
    gate_hard_threshold: 0.51
    gate_lr: 0.05
    gate_policy: learned
    gate_refine_steps: 40
    gate_temperature_end: 1.0
    gate_temperature_start: 1.0
    # 旧GS的mean P(m=1)，仅在学习门阶段生效。
    gs_activity_loss_weight: 0.001
    gs_rotation_lr: 0.0001
    gs_translation_lr: 0.0001
    incremental_steps: 100
    initial_gate_logit: 2.0
    m_fine_gate_lr: 0.02
    m_fine_sharing: true
    m_hard_forward: false
    m_initial_gate_logit: 0.0
    max_new_gaussians: null
    max_retained_gaussians: 200
    motion_gradient_mode: all_split
    motion_init_decay: 0.0
    motion_rotation_step_rad: 0.0001
    motion_steps: 240
    motion_xyz_step_extent: 1.0e-06
    new_logscale_step: 0.001
    new_max_screen_size: 20.0
    new_opacity_step: 0.01
    new_rotation_step: 0.001
    new_sh_step: 0.001
    new_xyz_step_extent: 1.0e-05
    opacity_keep_threshold: 0.01
    opacity_support_temperature: 0.05
    rebase_on_hardening: true
    refine_lr_scale: 0.1
    region_rotation_lr: 5.0e-05
    region_translation_lr: 0.0005
    reset_keep_gate_priors: false
    shared_warmup_steps: 0
    # 选中簇/局部运动+GS编号/归属/门/中心+新增/删除，除以首帧GS数*24。
    storage_loss_weight: 0.001
    storage_only: true
    storage_ramp_steps: 20
    storage_warmup_steps: 140
    # 初始帧及每5帧刷新簇；其余帧按GS身份复用归属。
    tree_builder: rigid_cluster
    tree_probe_steps: 40
    # 8个空间近邻只限制候选；按共享SE3拟合误差分组，没有空间打分项。
    tree_cluster_neighbors: 8
    tree_cluster_iterations: 3
    tree_cluster_spatial_weight: 0.0  # 避免空间项压过运动拟合
    # 朝向拟合的等效长度=scene extent*0.01。
    tree_cluster_orientation_extent: 0.01
    # 至少被两个不同的训练相机看见；不读取测试相机或未来帧。
    tree_probe_min_observations: 2
    tree_rebuild_interval: 5
    tree_rebuild_neighbors: 3
    # float32运动；uint32 GS编号；区域编号按范围用uint16/uint32；普通bool门，无熵编码。
    motion_export_format: sparse_parameters
output_dir: output
quiet: false
random_seed: 0
trainer:
  cache_data_on_device: true
  first_frame_testing_steps: []
  num_incr_steps: 340
  num_init_steps: 15000
  saving_ckpt_frames: *id001
  saving_ckpt_steps: []
  selective_console_mode: compact
  testing_steps: []
