# 复用已完成的双折候选记录，在独立源clone中验证真实反馈写回。
experiment_name: fs_joint_feedback_transaction_3nodes
source_crossfold_run: output/fs_joint_feedback_crossfold_3nodes/20261008T100558
output_root: output/fs_joint_feedback_transaction_3nodes
device: cuda

nodes:
  - {frame: 5, step: 120, level: 1, node: 2552}
  - {frame: 75, step: 180, level: 0, node: 926}
  - {frame: 99, step: 180, level: 0, node: 43}

# 两个方向都严格优于源状态才可进入选择；不另设绝对收益阈值。
require_bidirectional_positive: true
source_candidate_gain: 0.0

# 选中结构从原快照重新拟合。20张普通训练图各使用一次，cam00不参与。
camera_names: [cam01.png, cam02.png, cam03.png, cam04.png, cam05.png,
               cam06.png, cam07.png, cam08.png, cam09.png, cam10.png,
               cam11.png, cam12.png, cam13.png, cam14.png, cam15.png,
               cam16.png, cam17.png, cam18.png, cam19.png, cam20.png]
seed: 0
deployment_fit_steps: 20
fit_lr_scale: 1.0
view_sequence: seeded_balanced_cycle

# 独立Adam只更新目标gate/precision行；达到目标硬选择即停止。
max_feedback_logit_steps: 128
feedback_lr: 0.02
feedback_betas: [0.9, 0.999]
feedback_eps: 1.0e-15
acceptance_requires_strict_positive_realized_gain: true
