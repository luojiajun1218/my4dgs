# 空闲GPU下的只读渲染评测；严格核对恢复后的质量。
checkpoint_frames: [1, 49, 149, 299]
checkpoint_step: 300
quality_reference: quantized_summary
evaluation_resolution: -1
image_size: [1600, 1199]
