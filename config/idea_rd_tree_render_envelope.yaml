# Codec-envelope + renderer STE diagnosis; no monotonicity guarantee.
experiment_name: idea_rd_tree_render_envelope
base_config: config/flame_steak_recongs_100_controlled.yaml
frame: 1
seed: 20260920
gradient_view_indices: [0, 5, 10, 15]
check_view_indices: [2, 7, 12, 17]
max_depth: 13
min_leaf_size: 24
quant_step: 0.0001
curvatures: []
normalized_rate_weights: []
envelope_runs:
  - {name: low_curvature, curvature: 0.0003, normalized_rate: 0.0001, step_fraction: 0.5, iterations: 16}
  - {name: medium_curvature, curvature: 0.001, normalized_rate: 0.0001, step_fraction: 0.5, iterations: 16}
  - {name: high_rate, curvature: 0.001, normalized_rate: 0.001, step_fraction: 0.5, iterations: 16}
  - {name: zero_rate, curvature: 0.001, normalized_rate: 0.0, step_fraction: 0.5, iterations: 16}
