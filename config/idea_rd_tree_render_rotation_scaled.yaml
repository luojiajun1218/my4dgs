# Larger rotational curvature after long-tailed rotation gradients were observed.
# This is a diagnostic sensitivity check, not a test-view tuned final setting.
experiment_name: idea_rd_tree_render_rotation_scaled
base_config: config/flame_steak_recongs_100_controlled.yaml
frame: 1
seed: 20260920
gradient_view_indices: [0, 5, 10, 15]
check_view_indices: [2, 7, 12, 17]
max_depth: 13
min_leaf_size: 24
partition: geometry_2means
clustering_iterations: 4
rotation: true
quant_step: [0.0001, 0.0001, 0.0001, 0.001, 0.001, 0.001]
curvatures: []
normalized_rate_weights: []
envelope_runs:
  - name: rotation_rho_01
    curvature: [0.001, 0.001, 0.001, 0.01, 0.01, 0.01]
    normalized_rate: 0.0001
    step_fraction: 0.5
    iterations: 16
  - name: rotation_rho_1
    curvature: [0.001, 0.001, 0.001, 0.1, 0.1, 0.1]
    normalized_rate: 0.0001
    step_fraction: 0.5
    iterations: 16
