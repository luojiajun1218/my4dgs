# Repeat the frame1 probe with a different deterministic camera-group order.
experiment_name: idea_rd_tree_render_viewcycle_seed7
base_config: config/flame_steak_recongs_100_controlled.yaml
frame: 1
seed: 7
gradient_view_indices: [0, 1, 3, 4, 5, 6, 8, 9, 10, 11, 13, 14, 15, 16, 18, 19]
gradient_group_size: 4
shuffle_gradient_groups: true
check_view_indices: [2, 7, 12, 17]
max_depth: 13
min_leaf_size: 24
partition: geometry_2means
clustering_iterations: 4
rotation: true
optimized_projection: true
quant_step: [0.0001, 0.0001, 0.0001, 0.001, 0.001, 0.001]
curvatures: []
normalized_rate_weights: []
envelope_runs:
  - name: medium_rate
    curvature: [0.001, 0.001, 0.001, 0.01, 0.01, 0.01]
    normalized_rate: 0.0001
    step_fraction: 0.5
    iterations: 16
  - name: zero_rate
    curvature: [0.001, 0.001, 0.001, 0.01, 0.01, 0.01]
    normalized_rate: 0.0
    step_fraction: 0.5
    iterations: 16
